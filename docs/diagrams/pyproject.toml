[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-diagrams"
version = "1.0.0"
description = "Architecture diagrams for Sandbox for AWS using Python diagrams library"
authors = [{name = "oceansoft.io", email = "info@oceansoft.io"}]
requires-python = ">=3.10"
dependencies = [
  "diagrams>=0.24.1",
]

[project.license]
text = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
