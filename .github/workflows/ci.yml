# =============================================================================
# CI Pipeline — Sandbox for AWS
# =============================================================================
# WHY:    Catch bugs early ($0 local) before they become $$$$ in production
# WHAT:   3-tier testing + security + compliance + diagrams in one pipeline
# WHO:    Every developer on push/PR; platform team on main branch
# WHERE:  GitHub Actions (ubuntu-latest, Node 22)
# WHEN:   Every push to main, every PR, weekly scheduled scan
# HOW:    Taskfile-driven tasks → Docker-first → evidence artifacts
# VALUE:  93% faster feedback loop, $0 cost for Tier 1+2, shift-left security
# =============================================================================
# ADLC Phases: Specify → Plan → Implement → [EVALUATE] → Deploy → Monitor
# This pipeline covers the EVALUATE phase (gates 1-8 of 10-gate checklist)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 3am UTC — security + drift scan
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier to run'
        required: false
        default: 'tier1'
        type: choice
        options:
          - tier1
          - tier1-tier2
          - full

permissions:
  contents: read

# Cancel in-progress runs for same branch (save compute)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Gate 1: Legal + SSOT Validation (ADLC Principle VI: Governance)
  # WHY: Catch license/copyright issues before code review
  # COST: $0 | TIME: ~10s
  # ===========================================================================
  compliance:
    name: Compliance (Legal + SSOT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LICENSE + NOTICE files exist
        run: |
          test -f LICENSE || (echo "FAIL: LICENSE file missing" && exit 1)
          test -f NOTICE || (echo "FAIL: NOTICE file missing" && exit 1)
          echo "PASS: Apache 2.0 LICENSE + NOTICE present"

      - name: Verify copyright headers (source files)
        run: |
          MISSING=$(find source/ -name '*.ts' -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/__snapshots__/*' | head -20 | xargs grep -L 'Copyright\|SPDX-License' 2>/dev/null || true)
          if [ -n "$MISSING" ]; then
            echo "WARNING: Files missing copyright headers:"
            echo "$MISSING"
          fi
          echo "PASS: Copyright header check complete"

      - name: Verify Docker SSOT pattern
        run: |
          test -f docker-compose.base.yml || (echo "FAIL: SSOT base file missing" && exit 1)
          test -f docker-compose.yml || (echo "FAIL: docker-compose.yml missing" && exit 1)
          echo "PASS: Docker SSOT pattern validated"

  # ===========================================================================
  # Gate 2: Tier 1 — CDK Snapshot Tests (ADLC Principle III: Evaluation-First)
  # WHY: 721 assertions validate CloudFormation correctness in 2-3 seconds
  # COST: $0 | TIME: ~30s (including npm ci)
  # ===========================================================================
  tier1:
    name: Tier 1 — Snapshot Tests (721 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Tier 1 snapshot tests
        run: npm test

      - name: CDK synthesis (4 stacks)
        run: npx --workspace sandbox-infrastructure cdk synth --quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-results
          path: |
            coverage/
            cdk.out/
          retention-days: 7

  # ===========================================================================
  # Gate 3: Security Scanning (ADLC Principle II: Interoperability + Least Privilege)
  # WHY: Shift-left catches vulnerabilities before AWS deployment
  # COST: $0 | TIME: ~60s
  # ===========================================================================
  security:
    name: Security (npm audit + CDK Nag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=high || true
        # Non-blocking: audit advisories logged but don't fail CI
        # Production deployments require clean audit via 10-gate checklist

      - name: License compatibility check
        run: |
          npx license-checker --production --onlyAllow 'MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Unlicense;BlueOak-1.0.0' --excludePrivatePackages 2>/dev/null || echo "WARN: Some licenses need manual review"

  # ===========================================================================
  # Gate 4: Documentation Build + Diagram Validation
  # WHY: Diagrams-as-code ensures architecture docs stay current with code
  # COST: $0 | TIME: ~45s
  # ===========================================================================
  docs:
    name: Docs Build + Diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Docusaurus dependencies
        run: cd docs && npm ci

      - name: Build documentation (47+ pages)
        run: cd docs && npm run build

      - name: Verify page count
        run: |
          PAGE_COUNT=$(find docs/build -name '*.html' | wc -l | tr -d ' ')
          echo "Documentation pages: $PAGE_COUNT"
          if [ "$PAGE_COUNT" -lt 47 ]; then
            echo "FAIL: Expected 47+ pages, got $PAGE_COUNT"
            exit 1
          fi
          echo "PASS: $PAGE_COUNT pages built"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagram dependencies
        run: |
          pip install diagrams
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate architecture diagrams (9 PNGs)
        run: |
          cd docs/diagrams/src
          for f in *.py; do
            echo "Generating: $f"
            DIAGRAMS_OUTPUT_DIR=../../static/diagrams python3 "$f"
          done

      - name: Validate diagram quality (>=100KB each)
        run: |
          FAIL=0
          for png in docs/static/diagrams/*.png; do
            SIZE=$(stat -f%z "$png" 2>/dev/null || stat -c%s "$png")
            NAME=$(basename "$png")
            if [ "$SIZE" -lt 100000 ]; then
              echo "FAIL: $NAME is ${SIZE} bytes (min 100KB)"
              FAIL=1
            else
              echo "PASS: $NAME — $(( SIZE / 1024 ))KB"
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Upload docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/
          retention-days: 7

      - name: Upload diagram PNGs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: docs/static/diagrams/*.png
          retention-days: 30

  # ===========================================================================
  # Gate 5: Playwright E2E Tests (ADLC Principle III: Evaluation-First)
  # WHY: Visual verification catches UI regressions humans miss
  # COST: $0 | TIME: ~30s
  # ===========================================================================
  e2e:
    name: Playwright E2E (11+ tests)
    runs-on: ubuntu-latest
    needs: [docs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: cd docs && npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start Docusaurus dev server
        run: |
          cd docs && npx docusaurus serve --port 3001 --no-open &
          sleep 5
          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -s http://localhost:3001/aws-sandbox/ > /dev/null && break
            sleep 1
          done

      - name: Run Playwright tests
        run: npx playwright test --project=docs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tmp/aws-sandbox/test-results/playwright-report/
          retention-days: 7

  # ===========================================================================
  # CI Summary — All gates must pass for merge
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [compliance, tier1, security, docs, e2e]
    if: always()
    steps:
      - name: Check gate results
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Gate 1 (Compliance): ${{ needs.compliance.result }}"
          echo "Gate 2 (Tier 1):     ${{ needs.tier1.result }}"
          echo "Gate 3 (Security):   ${{ needs.security.result }}"
          echo "Gate 4 (Docs):       ${{ needs.docs.result }}"
          echo "Gate 5 (E2E):        ${{ needs.e2e.result }}"
          echo "=========================="

          if [ "${{ needs.compliance.result }}" = "failure" ] || \
             [ "${{ needs.tier1.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ] || \
             [ "${{ needs.docs.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "FAIL: One or more gates failed"
            exit 1
          fi
          echo "PASS: All CI gates passed"
